  .stage{
    position:relative;height:220px;background:var(--pink);
    border:3px solid var(--ink);overflow:hidden;margin-bottom:22px;cursor:pointer;
    touch-action:manipulation;
  }
  .stage:focus-visible{outline:3px solid var(--violet-ink);outline-offset:2px;}
  .ground{position:absolute;left:0;right:0;bottom:38px;height:0;border-top:3px dashed rgba(58,10,29,0.35);}
  .runner2{position:absolute;left:60px;bottom:38px;width:38px;height:50px;will-change:transform;}
  .runner2 svg{width:100%;height:100%;}
  .hurdle2{position:absolute;bottom:38px;width:30px;height:28px;}
  .hurdle2 .leg{position:absolute;bottom:0;width:3px;height:18px;background:var(--ink);border-radius:1px;}
  .hurdle2 .leg:first-of-type{left:3px;}
  .hurdle2 .leg:last-of-type{left:24px;}
  .hurdle2 .bar{position:absolute;top:0;left:0;width:30px;height:12px;background:var(--ink);border-radius:4px;opacity:0.8;}
  .hud{position:absolute;top:16px;right:20px;font-family:'Archivo Black','Arial Black',sans-serif;font-size:1.6rem;color:var(--ink);font-variant-numeric:tabular-nums;}
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:rgba(58,10,29,0.62);color:#fff;text-align:center;padding:20px;
  }
  .overlay h2{color:#fff;font-size:1.6rem;text-transform:uppercase;font-family:'Archivo Black','Arial Black',sans-serif;}
  .overlay p{margin:0;color:rgba(255,255,255,0.85);font-size:0.95rem;font-weight:600;}
  .overlay button{
    background:var(--orange);color:var(--ink);border:3px solid #fff;
    padding:12px 26px;font-weight:800;font-size:0.95rem;font-family:'Archivo',sans-serif;
    text-transform:uppercase;letter-spacing:0.03em;cursor:pointer;
    border-radius:28px 6px 28px 6px;
  }
  .hint{font-size:0.85rem;color:var(--ink-soft);margin-top:4px;font-weight:600;}
</style>

<main>
  <section>
    <div class="wrap">
      <div class="stage" id="stage" tabindex="0" role="button" aria-label="Skoč">
        <div class="ground"></div>
        <div class="runner2" id="runner">
          <svg viewBox="0 0 34 44" fill="none"><circle cx="20" cy="7" r="5" fill="var(--paper)"/><path d="M18 12 L16 24 L9 30 M16 24 L24 27 L27 20 M16 18 L26 15" stroke="var(--paper)" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 30 L5 38 M27 20 L31 14" stroke="var(--ink)" stroke-width="3.4" stroke-linecap="round"/></svg>
        </div>

<script>
(function () {
  var stage = document.getElementById("stage");
  var runner = document.getElementById("runner");
  var overlay = document.getElementById("overlay");
  var scoreEl = document.getElementById("score");
  var startBtn = document.getElementById("startBtn");
  var hint = document.getElementById("hint");

  var GROUND = 38, RUNNER_X = 60, RUNNER_W = 38, RUNNER_H = 50;
  var HURDLE_W = 14, HURDLE_H = 50;
  var JUMP_DURATION = 620, JUMP_HEIGHT = 78;

  var running = false;
  var score = 0;
  var speed = 0.16;
  var hurdles = [];
  var lastSpawn = 0;
  var spawnGap = 1400;
  var isJumping = false;
  var jumpStart = 0;
  var rafId = null;
  var lastTime = null;
  var bestScore = 0;

  function stageWidth() {
    return stage.clientWidth;
  }

  function reset() {
    hurdles.forEach(function (h) { h.el.remove(); });
    hurdles = [];
    score = 0;
    speed = 0.16;
    spawnGap = 1400;
    lastSpawn = 0;
    isJumping = false;
    runner.style.transform = "translateY(0px)";
    scoreEl.textContent = "0";
  }

  function jump() {
    if (isJumping || !running) return;
    isJumping = true;
    jumpStart = performance.now();
  }

  function updateJump(now) {
    if (!isJumping) return 0;
    var t = now - jumpStart;
    if (t >= JUMP_DURATION) {
      isJumping = false;
      return 0;
    }
    var progress = t / JUMP_DURATION;
    var y = Math.sin(progress * Math.PI) * JUMP_HEIGHT;
    return y;
  }

  function spawnHurdle() {
    var el = document.createElement("div");
    el.className = "hurdle2";
    el.innerHTML = '<span class="leg"></span><span class="leg"></span><span class="bar"></span>';
    stage.appendChild(el);
    hurdles.push({ el: el, x: stageWidth() + 10, passed: false });
  }

  function endGame() {
    running = false;
    cancelAnimationFrame(rafId);
    if (score > bestScore) bestScore = score;
    overlay.innerHTML =
      '<h2>Koniec — ' + score + ' prekážok</h2>' +
      '<p>' + (bestScore > 0 ? "Najlepšie skóre: " + bestScore : "") + '</p>' +
      '<button id="startBtn">Skúsiť znova</button>';
    overlay.style.display = "flex";
    document.getElementById("startBtn").addEventListener("click", startGame);
  }

  function startGame() {
    reset();
    overlay.style.display = "none";
    running = true;
    lastTime = null;
    rafId = requestAnimationFrame(loop);
  }

  function loop(now) {
    if (!running) return;
    if (lastTime === null) lastTime = now;
    var dt = now - lastTime;
    lastTime = now;

    speed += dt * 0.000006;
    spawnGap = Math.max(750, 1400 - speed * 2200);

    lastSpawn += dt;
    if (lastSpawn > spawnGap) {
      spawnHurdle();
      lastSpawn = 0;
    }

    var jumpY = updateJump(now);
    runner.style.transform = "translateY(-" + jumpY + "px)";

    var runnerBottom = GROUND + jumpY;
    var collided = false;

    for (var i = hurdles.length - 1; i >= 0; i--) {
      var h = hurdles[i];
      h.x -= speed * dt;
      h.el.style.left = h.x + "px";

      var overlapX = (h.x < RUNNER_X + RUNNER_W) && (h.x + HURDLE_W > RUNNER_X);
      if (overlapX && runnerBottom < HURDLE_H - 6) {
        collided = true;
      }
      if (!h.passed && h.x + HURDLE_W < RUNNER_X) {
        h.passed = true;
        score += 1;
        scoreEl.textContent = String(score);
      }
      if (h.x < -40) {
        h.el.remove();
        hurdles.splice(i, 1);
      }
    }

    if (collided) {
      endGame();
      return;
    }
    rafId = requestAnimationFrame(loop);
  }

  startBtn.addEventListener("click", startGame);
  stage.addEventListener("click", function () {
    if (!running) return;
    jump();
  });
  stage.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "ArrowUp") {
      e.preventDefault();
      if (!running) { startGame(); } else { jump(); }
    }
  });
  document.addEventListener("keydown", function (e) {
    if ((e.code === "Space" || e.code === "ArrowUp") && document.activeElement !== stage) {
      e.preventDefault();
      if (!running) { startGame(); } else { jump(); }
    }
  });

  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    hint.textContent = "Tvoj systém preferuje menej pohybu — hra stále používa nutný pohyb prekážok, keďže je to jej jadro.";
  }
})();
</script>
